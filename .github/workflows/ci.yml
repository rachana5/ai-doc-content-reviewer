name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill: [content-reviewer, review-doc-pr, review-doc-pr-proxy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest
      - name: Run tests
        run: |
          cd plugins/doc-content-reviewer/skills/${{ matrix.skill }}
          PYTHONPATH=. python3 -m pytest scripts/tests/ -v

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill: [content-reviewer, review-doc-pr, review-doc-pr-proxy]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pyflakes
        run: pip install pyflakes
      - name: Run pyflakes
        run: python -m pyflakes plugins/doc-content-reviewer/skills/${{ matrix.skill }}/scripts/
